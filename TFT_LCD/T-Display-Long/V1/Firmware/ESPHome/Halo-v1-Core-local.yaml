#Define Project
substitutions:
  name: halo
  version: "26.2.0.0"
  led_count: "4"
  device_description: ${name} - v${version}.

psram:
  mode: octal
  # speed: 120MHz

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    # platform_version: 6.9.0
    # version: 5.3.1

esp32_improv:
  authorizer: none

external_components:
  - source: github://yashmulgaonkar/esphome-components
    components: [axs15231, sy6970]

  - source:
      type: local
      path: ./external_components/esphome_rmt_compat
    components: [ esp32_rmt, esp32_rmt_led_strip ]
    refresh: 0s


spi:
  id: lily_spi
  type: quad
  clk_pin: 17
  data_pins:
    - 13
    - 18
    - 21
    - 14

captive_portal:

logger:
  level: DEBUG

globals:
  - id: cycleCounter
    type: int
    restore_value: no
    initial_value: '0'
  - id: temp_unit_changed
    type: bool
    initial_value: "true"
  - id: temperature_history
    type: std::vector<float>
    restore_value: no
    initial_value: 'std::vector<float>(180, 0.0f)'
  - id: co2_history
    type: std::vector<float>
    restore_value: no
    initial_value: 'std::vector<float>(180, 0.0f)'
  - id: pm1_history
    type: std::vector<float>
    restore_value: no
    initial_value: 'std::vector<float>(180, 0.0f)'
  - id: pm25_history
    type: std::vector<float>
    restore_value: no
    initial_value: 'std::vector<float>(180, 0.0f)'
  - id: pm4_history
    type: std::vector<float>
    restore_value: no
    initial_value: 'std::vector<float>(180, 0.0f)'
  - id: pm10_history
    type: std::vector<float>
    restore_value: no
    initial_value: 'std::vector<float>(180, 0.0f)'
  - id: voc_history
    type: std::vector<float>
    restore_value: no
    initial_value: 'std::vector<float>(180, 0.0f)'
  - id: humidity_history
    type: std::vector<float>
    restore_value: no
    initial_value: 'std::vector<float>(180, 0.0f)'
  - id: pressure_history
    type: std::vector<float>
    restore_value: no
    initial_value: 'std::vector<float>(360, 1013.0f)'
  - id: touch_cooldown_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: current_page_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: selected_graph_metric
    type: int
    restore_value: no
    initial_value: '3'
  - id: graph_transition_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: graph_transition_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: graph_transition_last_frame_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_graph_switch_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

switch:
  - platform: template
    name: "LED: Startup Blink"
    id: startup_light_blink
    icon: mdi:lightbulb
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    entity_category: "config"
  - platform: template
    name: "LED: Auto Air Quality"
    id: auto_air_quality_leds
    icon: mdi:brightness-auto
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - script.execute: update_air_quality_leds
    turn_off_action:
      - light.turn_off: rgb_light
  - platform: template
    name: "LED: Auto Night Mode"
    id: auto_led_night_mode
    icon: mdi:weather-night
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - script.execute: update_air_quality_leds
    turn_off_action:
      - script.execute: update_air_quality_leds
  - platform: template
    name: "Display: Adaptive Brightness"
    id: adaptive_display_brightness
    icon: mdi:brightness-percent
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - script.execute: update_display_brightness
  - platform: template
    name: "Graph: Auto Switch"
    id: auto_graph_switching
    icon: mdi:chart-timeline-variant
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - lambda: 'id(last_graph_switch_ms) = millis();'
    turn_off_action:
      - lambda: 'id(last_graph_switch_ms) = millis();'
  - platform: template
    name: "Display: 24h Clock"
    id: time_format
    icon: mdi:clock-digital
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    entity_category: "config"

select:
  - platform: template
    name: "Display: Temperature Unit"
    id: display_temperature_unit
    entity_category: "config"
    options:
     - "Fahrenheit"
     - "Celsius"
     - "Kelvin"
    initial_option: "Fahrenheit"
    restore_value: true
    optimistic: true
    on_value:
      - globals.set:
          id: temp_unit_changed
          value: "true"
  - platform: template
    name: "Display: Sleep Mode"
    id: display_sleep_mode
    entity_category: "config"
    options:
      - "Always On"
      - "Auto Off"
    initial_option: "Always On"
    restore_value: true
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: 'return x == "Always On";'
          then:
            - script.execute: wake_display
          else:
            - script.execute: update_display_brightness
  - platform: template
    name: "Graph: Transition"
    id: graph_transition_mode
    entity_category: "config"
    options:
      - "Instant"
      - "Fade"
      - "Wipe"
      - "Fade + Wipe"
    initial_option: "Fade + Wipe"
    restore_value: true
    optimistic: true
    on_value:
      - lambda: |-
          id(graph_transition_active) = false;
      - script.execute: redraw_graphs
  - platform: template
    name: "Graph: Transition Smoothness"
    id: graph_transition_smoothness
    entity_category: "config"
    options:
      - "Normal"
      - "Smooth"
      - "Very Smooth"
    initial_option: "Smooth"
    restore_value: true
    optimistic: true
    on_value:
      - lambda: |-
          id(graph_transition_active) = false;
      - script.execute: redraw_graphs
  - platform: template
    name: "Graph: Transition Curve"
    id: graph_transition_curve
    entity_category: "config"
    options:
      - "Linear"
      - "Ease Out"
      - "Ease In-Out"
    initial_option: "Ease In-Out"
    restore_value: true
    optimistic: true
    on_value:
      - lambda: |-
          id(graph_transition_active) = false;
      - script.execute: redraw_graphs

interval:
  - interval: 10s
    then:    
      if:
        condition:
          wifi.connected:
        then:
          - lvgl.widget.update:
              id: wifi_stat
              text_color: my_green
          - lvgl.widget.show:
              id: ym_image              
        else:
          - lvgl.widget.update:
              id: wifi_stat
              text_color: my_red

  - interval: 1s
    then:
      - script.execute: time_update  

  - interval: 1s
    then:
      - if:
          condition:
            switch.is_on: auto_graph_switching
          then:
            - lambda: |-
                const uint32_t now_ms = millis();
                const uint32_t interval_ms = static_cast<uint32_t>(id(graph_switch_interval).state * 1000.0f);
                if (interval_ms == 0) {
                  id(last_graph_switch_ms) = now_ms;
                  return;
                }
                if ((now_ms - id(last_graph_switch_ms)) >= interval_ms) {
                  id(advance_auto_graph_selection).execute();
                }

  - interval: 16ms
    then:
      - if:
          condition:
            lambda: 'return id(graph_transition_active);'
          then:
            - lambda: |-
                const uint32_t now_ms = millis();
                uint32_t frame_step_ms = 33;
                if (id(graph_transition_smoothness).state == "Normal") {
                  frame_step_ms = 50;
                } else if (id(graph_transition_smoothness).state == "Very Smooth") {
                  frame_step_ms = 16;
                }
                if (id(graph_transition_last_frame_ms) != 0 && (now_ms - id(graph_transition_last_frame_ms)) < frame_step_ms) {
                  return;
                }
                id(graph_transition_last_frame_ms) = now_ms;
                const float duration_ms = std::max(100.0f, id(graph_transition_duration).state);
                const float elapsed_ms = static_cast<float>(now_ms - id(graph_transition_start_ms));
                if (elapsed_ms >= duration_ms) {
                  id(graph_transition_active) = false;
                  id(graph_transition_last_frame_ms) = 0;
                }
            - script.execute: redraw_graphs

  - interval: 60s
    then:
      - script.execute: update_display_brightness
      - script.execute: update_air_quality_leds
      - script.execute: update_alert_state
      - script.execute: update_footer_summary
      - script.execute: refresh_status_page

  - interval: 1s
    then:
      - if:
          condition:
            - binary_sensor.is_off: ink_ha_connected
            - lambda: 'return id(cycleCounter) < 30;'
            - switch.is_on: startup_light_blink

          then:
            - light.turn_on:
                id: rgb_light
                effect: "Addressable Rainbow"
            - lambda: 'id(cycleCounter) += 1;'

  - interval: 1s
    then:
      - if:
          condition:
            - binary_sensor.is_off: ink_ha_connected
            - lambda: 'return id(cycleCounter) > 30;'
            - lambda: 'return id(cycleCounter) < 31;'
            - switch.is_on: startup_light_blink

          then:
            - light.turn_off:
                id: rgb_light
            - lambda: 'id(cycleCounter) += 1;'              

api:
  on_client_connected:
      - delay: 1s
      - script.execute: update_display_brightness
      - if:
          condition:
            switch.is_on: auto_air_quality_leds
          then:
            - script.execute: update_air_quality_leds
          else:
            - light.turn_off: rgb_light
      - script.execute: update_alert_state
      - script.execute: update_footer_summary
      - script.execute: update_page_chrome
      - script.execute: refresh_status_page
      - lambda: 'id(cycleCounter) = 30;'    
  services:
    #Co2 Calibration Service
    - service: calibrate_co2_value
      variables:
        co2_ppm: float
      then:
        - scd4x.perform_forced_calibration:
            value: !lambda "return co2_ppm;"
            id: scd40
    - service: sen55_clean
      then:
        - sen5x.start_fan_autoclean: sen55    

i2c:
  - sda: 9
    scl: 48
    id: lily_i2c
  - sda: 15
    scl: 10
    id: touch_i2c

output:
  - platform: ledc
    pin: 1
    id: backlight
    frequency: 100Hz  #Datasheet suggests low-frequency PWM. Should prevent stability issues.
    
# sy6970:
#   i2c_id: touch_i2c
#   state_led_enable: false  # To turn off the blinking green status LED

display:
  - platform: qspi_dbi
    id: lily_display
    model: AXS15231
    spi_id: lily_spi
    dimensions:
      height: 640
      width: 180
    cs_pin: 12
    reset_pin: 16
    rotation: 0
    auto_clear_enabled: false

touchscreen:
  - platform: axs15231
    id: lily_touch
    display: lily_display
    i2c_id: touch_i2c
    interrupt_pin: GPIO11
    transform:
      mirror_x: false
      mirror_y: false
      swap_xy: false
    on_touch:
      - lambda: |-
            const uint32_t now_ms = millis();
            if (now_ms < id(touch_cooldown_until_ms)) {
              return;
            }

            if (!id(display_backlight).remote_values.is_on()) {
              id(touch_cooldown_until_ms) = now_ms + 300;
              id(wake_display).execute();
              return;
            }

            id(wake_display).execute();

            if (touch.x <= 92 && touch.y <= 36) {
              id(touch_cooldown_until_ms) = now_ms + 300;
              id(time_format).toggle();
              id(refresh_status_page).execute();
              return;
            }

            if (id(current_page_index) == 0 && touch.y >= 24 && touch.y <= 66) {
              id(touch_cooldown_until_ms) = now_ms + 300;
              id(toggle_auto_led_mode).execute();
              return;
            }

            if (id(current_page_index) == 0 && touch.x >= 5 && touch.x <= 175 && touch.y >= 266 && touch.y <= 616) {
              int selected_metric = 3;
              if (touch.y <= 304) {
                selected_metric = 0;
              } else if (touch.y <= 343) {
                selected_metric = 1;
              } else if (touch.y <= 382) {
                selected_metric = 2;
              } else if (touch.y <= 421) {
                selected_metric = 3;
              } else if (touch.y <= 460) {
                selected_metric = 4;
              } else if (touch.y <= 499) {
                selected_metric = 5;
              } else if (touch.y <= 538) {
                selected_metric = 6;
              } else if (touch.y <= 577) {
                selected_metric = 7;
              } else {
                selected_metric = 8;
              }

              id(set_graph_metric).execute(selected_metric);
              id(touch_cooldown_until_ms) = now_ms + 250;
              return;
            }

            if (id(current_page_index) == 0 && touch.x >= 5 && touch.x <= 175 && touch.y >= 72 && touch.y <= 124) {
              id(touch_cooldown_until_ms) = now_ms + 300;
              if (id(adaptive_display_brightness).state) {
                id(adaptive_display_brightness).turn_off();
                auto call = id(display_backlight).turn_on();
                call.set_transition_length(0);
                call.set_brightness(1.0f);
                call.perform();
              } else {
                id(adaptive_display_brightness).turn_on();
                id(update_display_brightness).execute();
              }
              id(refresh_status_page).execute();
              return;
            }

    on_update:
      - lambda: |-
            const uint32_t now_ms = millis();
            if (now_ms < id(touch_cooldown_until_ms)) {
              return;
            }

            for (const auto &touch : touches) {
              const int dx = touch.x - touch.x_org;
              const int dy = touch.y - touch.y_org;
              if ((dx <= -55 || dx >= 55) && dy > -70 && dy < 70) {
                id(touch_cooldown_until_ms) = now_ms + 550;
                if (dx < 0) {
                  id(show_next_page).execute();
                } else {
                  id(show_previous_page).execute();
                }
                return;
              }
            }

web_server:
  port: 80

