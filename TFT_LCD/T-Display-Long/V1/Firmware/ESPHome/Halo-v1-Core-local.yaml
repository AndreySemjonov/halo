  #         name: "Slow Pulse" 
  #         transition_length: 500ms
  #         update_interval: 500ms
  #         min_brightness: 10%
  #         max_brightness: 50%
  #     - addressable_rainbow:
  #         name: Rainbow Effect With Custom Values
  #         speed: 10
  #         width: 50

  - platform: esp32_rmt_led_strip
    name: Halo
    id: rgb_light
    rgb_order: GRB
    pin: GPIO47
    num_leds: ${led_count}
    chipset: WS2812
    restore_mode: RESTORE_AND_OFF
    effects:
      - addressable_rainbow:
          name: Addressable Rainbow

  - platform: monochromatic
    id: display_backlight
    output: backlight
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

lvgl:
  displays:
    - lily_display
  touchscreens:
    - lily_touch
  buffer_size: 100%
  page_wrap: true
  on_idle:
    - timeout: 45s
      then:
        - if:
            condition:
              and:
                - lambda: 'return id(display_sleep_mode).state == "Auto Off";'
                - light.is_on: display_backlight
            then:
              - light.turn_on:
                  id: display_backlight
                  brightness: 12%
                  transition_length: 500ms
    - timeout: 120s
      then:
        - if:
            condition:
              and:
                - lambda: 'return id(display_sleep_mode).state == "Auto Off";'
                - light.is_on: display_backlight
            then:
              - light.turn_off:
                  id: display_backlight
                  transition_length: 700ms
