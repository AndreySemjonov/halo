          call.set_green(green);
          call.set_blue(blue);
          call.perform();
  - id: update_pressure_trend
    mode: restart
    then:
      - lambda: |-
          const auto &hist = id(pressure_history);
          const size_t smooth_window = 15;

          auto average_window = [&](size_t offset_minutes, size_t window_minutes, bool &ok) -> float {
            ok = false;
            if (hist.empty()) {
              return 0.0f;
            }
            if (hist.size() <= offset_minutes) {
              return 0.0f;
            }

            const int end_index = static_cast<int>(hist.size()) - 1 - static_cast<int>(offset_minutes);
            const int start_index = std::max(0, end_index - static_cast<int>(window_minutes) + 1);
            if (end_index < start_index) {
              return 0.0f;
            }

            float sum = 0.0f;
            int count = 0;
            for (int i = start_index; i <= end_index; i++) {
              const float value = hist[i];
              if (value > 0.0f) {
                sum += value;
                count++;
              }
            }

            if (count == 0) {
              return 0.0f;
            }

            ok = true;
            return sum / static_cast<float>(count);
          };

          bool has_now = false;
          const float smooth_now = average_window(0, smooth_window, has_now);

          bool has_1h = false;
          bool has_3h = false;
          bool has_6h = false;
          const float smooth_1h = average_window(60, smooth_window, has_1h);
          const float smooth_3h = average_window(180, smooth_window, has_3h);
          const float smooth_6h = average_window(360, smooth_window, has_6h);

          float delta_1h = NAN;
          float delta_3h = NAN;
          float delta_6h = NAN;
          if (has_now && has_1h) delta_1h = smooth_now - smooth_1h;
          if (has_now && has_3h) delta_3h = smooth_now - smooth_3h;
          if (has_now && has_6h) delta_6h = smooth_now - smooth_6h;

          id(pressure_delta_1h).publish_state(delta_1h);
          id(pressure_delta_3h).publish_state(delta_3h);
          id(pressure_delta_6h).publish_state(delta_6h);

          std::string trend_text = "Gathering Data";
          std::string short_text = "WAIT";
          std::string message_text = "Collecting pressure history for trend analysis";
          lv_color_t trend_color = lv_color_hex(0x8DD8FF);

          const bool storm_risk =
              (has_1h && delta_1h <= -2.0f) ||
              (has_3h && delta_3h <= -4.0f) ||
              (has_6h && delta_6h <= -6.0f);

          const bool rapid_drop =
              (has_1h && delta_1h <= -1.5f) ||
              (has_3h && delta_3h <= -3.0f) ||
              (has_6h && delta_6h <= -5.0f);

          const bool improving =
              (has_1h && delta_1h >= 1.5f) ||
              (has_3h && delta_3h >= 3.0f) ||
              (has_6h && delta_6h >= 5.0f);

          const bool stable =
              has_3h && has_6h &&
              std::abs(delta_3h) < 1.0f &&
              std::abs(delta_6h) < 2.0f;

          if (storm_risk) {
            trend_text = "Storm Risk";
            short_text = "STORM";
            message_text = "Pressure dropping very fast - unsettled or windy weather possible";
            trend_color = lv_color_hex(0xFF4D4D);
          } else if (rapid_drop) {
            trend_text = "Rapid Drop";
            short_text = "DROP";
            message_text = "Pressure falling quickly - weather may worsen soon";
            trend_color = lv_color_hex(0xFFA500);
          } else if (improving) {
            trend_text = "Improving";
            short_text = "RISE";
            message_text = "Pressure rising - weather may improve";
            trend_color = lv_color_hex(0x76FA76);
          } else if (stable) {
            trend_text = "Stable";
            short_text = "STDY";
            message_text = "Pressure stable - weather pattern likely steady";
            trend_color = lv_color_hex(0xC0C0C0);
          } else if (has_1h || has_3h || has_6h) {
            trend_text = "Minor Drift";
            short_text = "DRIFT";
            message_text = "Pressure drifting - no strong weather signal";
            trend_color = lv_color_hex(0x8DD8FF);
          }

          id(pressure_trend_state).publish_state(trend_text);
          id(pressure_weather_message).publish_state(message_text);
          lv_label_set_text(id(pressure_trend_label), short_text.c_str());
          lv_obj_set_style_text_color(id(pressure_trend_label), trend_color, LV_PART_MAIN);
          lv_label_set_text(id(trends_pressure_value), trend_text.c_str());
          lv_obj_set_style_text_color(id(trends_pressure_value), trend_color, LV_PART_MAIN);
