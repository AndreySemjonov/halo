  - id: redraw_graphs
    mode: restart
    then:
      - lambda: |-
          auto blend_color = [](lv_color_t from, lv_color_t to, float progress) -> lv_color_t {
            progress = std::max(0.0f, std::min(1.0f, progress));
            const uint8_t from_r = static_cast<uint8_t>((from.full >> 11) & 0x1F);
            const uint8_t from_g = static_cast<uint8_t>((from.full >> 5) & 0x3F);
            const uint8_t from_b = static_cast<uint8_t>(from.full & 0x1F);
            const uint8_t to_r = static_cast<uint8_t>((to.full >> 11) & 0x1F);
            const uint8_t to_g = static_cast<uint8_t>((to.full >> 5) & 0x3F);
            const uint8_t to_b = static_cast<uint8_t>(to.full & 0x1F);

            const uint8_t out_r = static_cast<uint8_t>(std::round(from_r + ((to_r - from_r) * progress)));
            const uint8_t out_g = static_cast<uint8_t>(std::round(from_g + ((to_g - from_g) * progress)));
            const uint8_t out_b = static_cast<uint8_t>(std::round(from_b + ((to_b - from_b) * progress)));
            return lv_color_make(
              static_cast<uint8_t>((out_r * 255) / 31),
              static_cast<uint8_t>((out_g * 255) / 63),
              static_cast<uint8_t>((out_b * 255) / 31)
            );
          };

          auto draw_graph = [&](lv_obj_t *canvas, const std::vector<float> &hist, int graph_metric, float baseline, float window_minutes, lv_color_t color, uint8_t graph_opa, float reveal_progress) {
            const int width = lv_obj_get_width(canvas);
            const int height = lv_obj_get_height(canvas);
            const int axis_w = 28;
            const int left_pad = axis_w + 4;
            const int right_pad = 3;
            const int top_pad = 6;
            const int bottom_pad = 24;
            const int usable_w = std::max(1, width - left_pad - right_pad - 1);
            const int usable_h = std::max(1, height - top_pad - bottom_pad);

            lv_canvas_fill_bg(canvas, lv_color_hex(0x000000), LV_OPA_COVER);

            bool has_samples = false;
            float min_v = 0.0f;
            float max_v = baseline;
            for (float value : hist) {
              if (value > 0.0f) {
                if (!has_samples) {
                  min_v = value;
                  max_v = value;
                  has_samples = true;
                } else {
                  min_v = std::min(min_v, value);
                  max_v = std::max(max_v, value);
                }
              }
            }

            if (!has_samples) {
              min_v = 0.0f;
              max_v = baseline;
            }

            float range = max_v - min_v;
            const float reference = std::max(1.0f, std::max(std::fabs(min_v), std::fabs(max_v)));
            const float min_range = std::max(0.2f, reference * 0.0025f);
            if (range < min_range) {
              const float mid = (max_v + min_v) * 0.5f;
              min_v = mid - (min_range * 0.5f);
              max_v = mid + (min_range * 0.5f);
            }

            range = std::max(1.0f, max_v - min_v);
            const float padding = std::max(range * 0.12f, min_range * 0.35f);
            min_v -= padding;
            max_v += padding;
            range = std::max(1.0f, max_v - min_v);

            lv_draw_line_dsc_t axis_dsc;
            lv_draw_line_dsc_init(&axis_dsc);
            axis_dsc.color = lv_color_hex(0x244A52);
            axis_dsc.width = 1;

            auto axis_y_for_fraction = [&](float fraction) -> int {
              int y = top_pad + usable_h - static_cast<int>(fraction * usable_h);
              if (y < top_pad) y = top_pad;
              if (y > top_pad + usable_h) y = top_pad + usable_h;
              return y;
            };

            const int axis_top_y = axis_y_for_fraction(1.0f);
            const int axis_mid_y = axis_y_for_fraction(0.5f);
            const int axis_bottom_y = axis_y_for_fraction(0.0f);
            for (int y : {axis_top_y, axis_mid_y, axis_bottom_y}) {
              lv_point_t axis_pts[2];
              axis_pts[0].x = left_pad;
              axis_pts[0].y = y;
              axis_pts[1].x = width - right_pad;
              axis_pts[1].y = y;
              lv_canvas_draw_line(canvas, axis_pts, 2, &axis_dsc);

              lv_point_t tick_pts[2];
              tick_pts[0].x = left_pad - 4;
              tick_pts[0].y = y;
              tick_pts[1].x = left_pad - 1;
              tick_pts[1].y = y;
              lv_canvas_draw_line(canvas, tick_pts, 2, &axis_dsc);
            }

            auto format_axis_value = [&](float value) -> std::string {
              const float abs_value = std::fabs(value);
              const float display_range = max_v - min_v;
              int decimals = 1;
              if (graph_metric == 0 || graph_metric == 7) {
                decimals = 0;
              } else if (abs_value >= 100.0f || display_range >= 20.0f) {
                decimals = 0;
              } else if (display_range < 2.0f) {
                decimals = 2;
              }

              char buffer[20];
              snprintf(buffer, sizeof(buffer), "%.*f", decimals, value);
              return std::string(buffer);
            };

            lv_draw_label_dsc_t axis_label_dsc;
            lv_draw_label_dsc_init(&axis_label_dsc);
            axis_label_dsc.color = lv_color_hex(0x7A939B);
            axis_label_dsc.font = &lv_font_montserrat_12;
            axis_label_dsc.align = LV_TEXT_ALIGN_RIGHT;

            auto draw_axis_label = [&](int y, const std::string &text) {
              const int label_h = 10;
              int label_y = y - (label_h / 2);
              if (label_y < 0) label_y = 0;
              if (label_y > height - label_h) label_y = height - label_h;
              lv_canvas_draw_text(canvas, 0, label_y, axis_w, &axis_label_dsc, text.c_str());
            };

            draw_axis_label(axis_top_y, format_axis_value(max_v));
            draw_axis_label(axis_mid_y, format_axis_value((max_v + min_v) * 0.5f));
            draw_axis_label(axis_bottom_y, format_axis_value(min_v));

            lv_draw_label_dsc_t time_label_dsc;
            lv_draw_label_dsc_init(&time_label_dsc);
            time_label_dsc.color = lv_color_hex(0x6E858D);
            time_label_dsc.font = &lv_font_montserrat_12;
            time_label_dsc.align = LV_TEXT_ALIGN_CENTER;

            auto format_time_label = [&](float minutes_ago) -> std::string {
              if (!id(ha_time).now().is_valid()) {
                const int rounded = std::max(0, static_cast<int>(std::round(minutes_ago)));
                if (rounded == 0) {
                  return "now";
                }
                if (rounded >= 60) {
                  char buffer[10];
                  const float hours = rounded / 60.0f;
                  if (std::fabs(hours - std::round(hours)) < 0.05f) {
                    snprintf(buffer, sizeof(buffer), "-%.0fh", std::round(hours));
                  } else {
                    snprintf(buffer, sizeof(buffer), "-%.1fh", hours);
                  }
                  return std::string(buffer);
                }
                char buffer[10];
                snprintf(buffer, sizeof(buffer), "-%dm", rounded);
                return std::string(buffer);
              }

              auto now = id(ha_time).now();
              int total_minutes = now.hour * 60 + now.minute - static_cast<int>(std::round(minutes_ago));
              while (total_minutes < 0) total_minutes += 1440;
              total_minutes %= 1440;
              const int hh = total_minutes / 60;
              const int mm = total_minutes % 60;
              char buffer[8];
              snprintf(buffer, sizeof(buffer), "%02d:%02d", hh, mm);
              return std::string(buffer);
            };

            auto draw_time_label = [&](int center_x, const std::string &text) {
              constexpr int label_w = 34;
              int x = center_x - (label_w / 2);
              if (x < left_pad - 2) x = left_pad - 2;
              if (x > width - right_pad - label_w) x = width - right_pad - label_w;
              lv_canvas_draw_text(canvas, x, height - 16, label_w, &time_label_dsc, text.c_str());
            };

            draw_time_label(left_pad, format_time_label(window_minutes));
            draw_time_label(left_pad + (usable_w / 2), format_time_label(window_minutes * 0.5f));
            draw_time_label(left_pad + usable_w, format_time_label(0.0f));

            auto point_y = [&](float value) -> int {
              if (!std::isfinite(value)) {
                value = min_v;
              }
              int y = top_pad + usable_h - static_cast<int>(((value - min_v) / range) * usable_h);
              if (y < top_pad) y = top_pad;
              if (y > top_pad + usable_h) y = top_pad + usable_h;
              return y;
            };

            lv_draw_line_dsc_t fill_dsc;
            lv_draw_line_dsc_init(&fill_dsc);
            fill_dsc.color = color;
            fill_dsc.width = 1;
            fill_dsc.opa = static_cast<lv_opa_t>(std::max(0, std::min(255, static_cast<int>(graph_opa * 0.22f))));

            lv_draw_line_dsc_t line_dsc;
            lv_draw_line_dsc_init(&line_dsc);
            line_dsc.color = color;
            line_dsc.width = 3;
            line_dsc.round_start = 1;
            line_dsc.round_end = 1;
            line_dsc.opa = graph_opa;

            lv_point_t pts[2];
            const int point_count = hist.size();
            const float clamped_reveal = std::max(0.0f, std::min(1.0f, reveal_progress));
            const int reveal_limit_x = left_pad + static_cast<int>(usable_w * clamped_reveal);
            for (int i = 0; i < point_count - 1; i++) {
              int x1 = left_pad + (i * usable_w) / (point_count - 1);
              int x2 = left_pad + ((i + 1) * usable_w) / (point_count - 1);
              int y1 = point_y(hist[i]);
              int y2 = point_y(hist[i + 1]);

              if (x1 > reveal_limit_x) {
                break;
              }
              if (x2 > reveal_limit_x) {
                const float segment_ratio = x2 == x1 ? 0.0f : static_cast<float>(reveal_limit_x - x1) / static_cast<float>(x2 - x1);
                y2 = y1 + static_cast<int>((y2 - y1) * segment_ratio);
                x2 = reveal_limit_x;
              }

              lv_point_t fill_pts[2];
              fill_pts[0].x = x2;
              fill_pts[0].y = y2;
              fill_pts[1].x = x2;
              fill_pts[1].y = top_pad + usable_h + 1;
              lv_canvas_draw_line(canvas, fill_pts, 2, &fill_dsc);

              pts[0].x = x1;
              pts[0].y = y1;
              pts[1].x = x2;
              pts[1].y = y2;
              lv_canvas_draw_line(canvas, pts, 2, &line_dsc);
            }

            const float last_value = hist.empty() ? min_v : hist.back();
            const int last_x = reveal_limit_x;
            const int last_y = point_y(last_value);

            lv_draw_rect_dsc_t point_dsc;
            lv_draw_rect_dsc_init(&point_dsc);
            point_dsc.bg_color = color;
            point_dsc.bg_opa = graph_opa;
            point_dsc.border_opa = graph_opa;
            point_dsc.border_color = lv_color_hex(0x000000);
            point_dsc.border_width = 2;
            point_dsc.radius = LV_RADIUS_CIRCLE;
            if (graph_opa > 8 && clamped_reveal > 0.02f) {
              lv_canvas_draw_rect(canvas, last_x - 4, last_y - 4, 8, 8, &point_dsc);
            }
          };

          auto delta_for = [](const std::vector<float> &hist, size_t lookback) -> float {
            if (hist.size() <= lookback) {
              return 0.0f;
            }
            const float older = hist[hist.size() - 1 - lookback];
            const float current = hist.back();
            if (older <= 0.0f) {
              return 0.0f;
            }
            return current - older;
          };
          auto window_for_minutes = [](const std::vector<float> &hist, float minutes, float points_per_minute) -> std::vector<float> {
            const int requested_points = std::max(6, std::min(static_cast<int>(hist.size()), static_cast<int>(minutes * points_per_minute)));
            if (requested_points >= static_cast<int>(hist.size())) {
              return hist;
            }
            return std::vector<float>(hist.end() - requested_points, hist.end());
          };

          auto minutes_for_metric = [&](int metric) -> float {
            switch (metric) {
              case 0: return id(temperature_graph_minutes).state;
              case 1: return id(co2_graph_minutes).state;
              case 2: return id(pm1_graph_minutes).state;
              case 3: return id(pm25_graph_minutes).state;
              case 4: return id(pm4_graph_minutes).state;
              case 5: return id(pm10_graph_minutes).state;
              case 6: return id(voc_graph_minutes).state;
              case 7: return id(humidity_graph_minutes).state;
              case 8: return id(pressure_graph_minutes).state;
              default: return 10.0f;
            }
          };

          auto points_per_minute_for_metric = [&](int metric) -> float {
            return metric == 8 ? 1.0f : 6.0f;
          };
          auto format_history_window = [](float minutes) -> std::string {
            const int rounded = std::max(1, static_cast<int>(std::round(minutes)));
            if (rounded >= 60) {
              const float hours = static_cast<float>(rounded) / 60.0f;
              if (std::fabs(hours - std::round(hours)) < 0.05f) {
                char buffer[12];
                snprintf(buffer, sizeof(buffer), "%.0fh", std::round(hours));
                return std::string(buffer);
              }
              char buffer[12];
              snprintf(buffer, sizeof(buffer), "%.1fh", hours);
              return std::string(buffer);
            }
            char buffer[12];
            snprintf(buffer, sizeof(buffer), "%dmin", rounded);
            return std::string(buffer);
          };
          auto pm_color_for = [](float value) -> lv_color_t {
            if (value > 55.4f) return lv_color_hex(0xFF4D4D);
            if (value > 35.4f) return lv_color_hex(0xFFA500);
            if (value > 9.0f) return lv_color_hex(0xF4E66A);
            return lv_color_hex(0x76FA76);
          };

          auto graph_color_for_metric = [&](int metric, float value) -> lv_color_t {
            switch (metric) {
              case 0:
                if (value > 30.0f || value < 10.0f) return lv_color_hex(0xFF4D4D);
                if (value > 27.0f || value < 16.0f) return lv_color_hex(0xFFA500);
                if (value > 24.0f || value < 18.0f) return lv_color_hex(0xF4E66A);
                return lv_color_hex(0x76FA76);
              case 1:
                if (value > 1500.0f) return lv_color_hex(0xFF4D4D);
                if (value > 1000.0f) return lv_color_hex(0xFFA500);
                if (value > 600.0f) return lv_color_hex(0xF4E66A);
                return lv_color_hex(0x76FA76);
              case 2:
              case 3:
              case 4:
              case 5:
                return pm_color_for(value);
              case 6:
                if (value > 400.0f) return lv_color_hex(0xFF4D4D);
                if (value > 250.0f) return lv_color_hex(0xFFA500);
                if (value > 150.0f) return lv_color_hex(0xF4E66A);
                return lv_color_hex(0x76FA76);
              case 7:
                if (value > 70.0f || value < 10.0f) return lv_color_hex(0xFF4D4D);
                if (value > 60.0f || value < 20.0f) return lv_color_hex(0xFFA500);
                if (value > 50.0f || value < 30.0f) return lv_color_hex(0xF4E66A);
                return lv_color_hex(0x76FA76);
              case 8:
                return lv_color_hex(0x8DD8FF);
              default:
                return lv_color_hex(0x76FA76);
            }
          };

          auto set_row_palette = [&](int metric, lv_color_t active_color) {
            (void) active_color;
            const lv_color_t label_default = lv_color_hex(0xB8C7D1);
            const lv_color_t unit_default = lv_color_hex(0x94A3AD);
            auto reset_pair = [&](lv_obj_t *label, lv_obj_t *unit) {
              lv_obj_set_style_text_color(label, label_default, LV_PART_MAIN);
              lv_obj_set_style_text_color(unit, unit_default, LV_PART_MAIN);
            };
            auto set_row_bg = [&](lv_obj_t *row_obj, bool active) {
              lv_obj_set_style_bg_opa(row_obj, active ? static_cast<lv_opa_t>(96) : LV_OPA_TRANSP, LV_PART_MAIN);
            };

            reset_pair(id(temperature_label), id(temperature_units));
            reset_pair(id(co2_label), id(co2_units));
            reset_pair(id(pm1_label), id(pm1_units));
            reset_pair(id(pm25_label), id(pm25_units));
            reset_pair(id(pm4_label), id(pm4_units));
            reset_pair(id(pm10_label), id(pm10_units));
            reset_pair(id(voc_label), id(voc_units));
            reset_pair(id(rh_label), id(rh_units));
            reset_pair(id(pressure_label), id(pressure_units));
            lv_obj_set_style_text_color(id(pressure_trend_label), unit_default, LV_PART_MAIN);
            set_row_bg(id(temperature_row_bg), false);
            set_row_bg(id(co2_row_bg), false);
            set_row_bg(id(pm1_row_bg), false);
            set_row_bg(id(pm25_row_bg), false);
            set_row_bg(id(pm4_row_bg), false);
            set_row_bg(id(pm10_row_bg), false);
            set_row_bg(id(voc_row_bg), false);
            set_row_bg(id(rh_row_bg), false);
            set_row_bg(id(pressure_row_bg), false);

            switch (metric) {
              case 0: set_row_bg(id(temperature_row_bg), true); break;
              case 1: set_row_bg(id(co2_row_bg), true); break;
              case 2: set_row_bg(id(pm1_row_bg), true); break;
              case 3: set_row_bg(id(pm25_row_bg), true); break;
              case 4: set_row_bg(id(pm4_row_bg), true); break;
              case 5: set_row_bg(id(pm10_row_bg), true); break;
              case 6: set_row_bg(id(voc_row_bg), true); break;
              case 7: set_row_bg(id(rh_row_bg), true); break;
              case 8:
                set_row_bg(id(pressure_row_bg), true);
                break;
            }
          };

          const int metric = id(selected_graph_metric);
          const std::vector<float> *selected_hist = &id(pm25_history);
          float selected_baseline = 25.0f;
          float selected_value = id(pm_2_5).has_state() ? id(pm_2_5).state : 0.0f;
          float selected_delta_threshold = 3.0f;
          std::string selected_title = "PM2.5";
          std::string selected_value_text = "0.0 ug/m3";
          (void) selected_value_text;

          switch (metric) {
            case 0:
              selected_hist = &id(temperature_history);
              selected_baseline = 22.0f;
              selected_value = id(sen55_temperature).has_state() ? id(sen55_temperature).state : 0.0f;
              selected_delta_threshold = 0.4f;
              selected_title = "TEMP";
              {
                char buffer[24];
                if (id(display_temperature_unit).state == "Fahrenheit") {
                  snprintf(buffer, sizeof(buffer), "%.1f °F", (selected_value * 9.0f / 5.0f) + 32.0f);
                } else if (id(display_temperature_unit).state == "Kelvin") {
                  snprintf(buffer, sizeof(buffer), "%.1f K", selected_value + 273.15f);
                } else {
                  snprintf(buffer, sizeof(buffer), "%.1f °C", selected_value);
                }
                selected_value_text = buffer;
              }
              break;
            case 1:
              selected_hist = &id(co2_history);
              selected_baseline = 700.0f;
              selected_value = id(co2).has_state() ? id(co2).state : 0.0f;
              selected_delta_threshold = 80.0f;
              selected_title = "CO2";
              {
                char buffer[24];
                snprintf(buffer, sizeof(buffer), "%.0f ppm", selected_value);
                selected_value_text = buffer;
              }
              break;
            case 2:
              selected_hist = &id(pm1_history);
              selected_baseline = 15.0f;
              selected_value = id(pm_1_0).has_state() ? id(pm_1_0).state : 0.0f;
              selected_delta_threshold = 1.5f;
              selected_title = "PM1";
              {
                char buffer[24];
                snprintf(buffer, sizeof(buffer), "%.1f ug/m3", selected_value);
                selected_value_text = buffer;
              }
              break;
            case 3:
              selected_hist = &id(pm25_history);
              selected_baseline = 25.0f;
              selected_value = id(pm_2_5).has_state() ? id(pm_2_5).state : 0.0f;
              selected_delta_threshold = 3.0f;
              selected_title = "PM2.5";
              {
                char buffer[24];
                snprintf(buffer, sizeof(buffer), "%.1f ug/m3", selected_value);
                selected_value_text = buffer;
              }
              break;
            case 4:
              selected_hist = &id(pm4_history);
              selected_baseline = 25.0f;
              selected_value = id(pm_4_0).has_state() ? id(pm_4_0).state : 0.0f;
              selected_delta_threshold = 3.0f;
              selected_title = "PM4";
              {
                char buffer[24];
                snprintf(buffer, sizeof(buffer), "%.1f ug/m3", selected_value);
                selected_value_text = buffer;
              }
              break;
            case 5:
              selected_hist = &id(pm10_history);
              selected_baseline = 25.0f;
              selected_value = id(pm_10_0).has_state() ? id(pm_10_0).state : 0.0f;
              selected_delta_threshold = 3.0f;
              selected_title = "PM10";
              {
                char buffer[24];
                snprintf(buffer, sizeof(buffer), "%.1f ug/m3", selected_value);
                selected_value_text = buffer;
              }
              break;
            case 6:
              selected_hist = &id(voc_history);
              selected_baseline = 150.0f;
              selected_value = id(sen55_voc).has_state() ? id(sen55_voc).state : 0.0f;
              selected_delta_threshold = 20.0f;
              selected_title = "VOC";
              {
                char buffer[24];
                snprintf(buffer, sizeof(buffer), "%.0f IDX", selected_value);
                selected_value_text = buffer;
              }
              break;
            case 7:
              selected_hist = &id(humidity_history);
              selected_baseline = 45.0f;
              selected_value = id(sen55_humidity).has_state() ? id(sen55_humidity).state : 0.0f;
              selected_delta_threshold = 4.0f;
              selected_title = "RH";
              {
                char buffer[24];
                snprintf(buffer, sizeof(buffer), "%.0f %%", selected_value);
                selected_value_text = buffer;
              }
              break;
            case 8:
              selected_hist = &id(pressure_history);
              selected_baseline = 1013.0f;
              selected_value = id(bme280pressure).has_state() ? id(bme280pressure).state : 0.0f;
              selected_delta_threshold = 0.4f;
              selected_title = "PRESS";
              {
                char buffer[24];
                snprintf(buffer, sizeof(buffer), "%.0f hPa", selected_value);
                selected_value_text = buffer;
              }
              break;
          }

          const float selected_minutes = minutes_for_metric(metric);
          const std::vector<float> selected_hist_view = window_for_minutes(*selected_hist, selected_minutes, points_per_minute_for_metric(metric));
          const float selected_delta = delta_for(selected_hist_view, std::min<size_t>(5, selected_hist_view.size() > 1 ? selected_hist_view.size() - 1 : 0));
          std::string selected_meta = "STEADY";
          if (selected_delta > selected_delta_threshold) {
            selected_meta = "RISING";
          } else if (selected_delta < -selected_delta_threshold) {
            selected_meta = "FALLING";
          }
          const std::string selected_window = format_history_window(selected_minutes);
          const std::string selected_header_meta = selected_window + " | " + selected_meta;

          const lv_color_t selected_color = graph_color_for_metric(metric, selected_value);
          float transition_progress = 1.0f;
          if (id(graph_transition_active)) {
            const float duration_ms = std::max(100.0f, id(graph_transition_duration).state);
            const float raw_progress = std::max(0.0f, std::min(1.0f, static_cast<float>(millis() - id(graph_transition_start_ms)) / duration_ms));
            if (id(graph_transition_curve).state == "Ease Out") {
              transition_progress = 1.0f - ((1.0f - raw_progress) * (1.0f - raw_progress));
            } else if (id(graph_transition_curve).state == "Ease In-Out") {
              if (raw_progress < 0.5f) {
                transition_progress = 2.0f * raw_progress * raw_progress;
              } else {
                transition_progress = 1.0f - std::pow(-2.0f * raw_progress + 2.0f, 2.0f) * 0.5f;
              }
            } else {
              transition_progress = raw_progress;
            }
          }
          const bool use_fade = id(graph_transition_mode).state == "Fade" || id(graph_transition_mode).state == "Fade + Wipe";
          const bool use_wipe = id(graph_transition_mode).state == "Wipe" || id(graph_transition_mode).state == "Fade + Wipe";
          const uint8_t selected_graph_opa = use_fade ? static_cast<uint8_t>(std::max(26.0f, std::round(transition_progress * 255.0f))) : LV_OPA_COVER;
          const float selected_reveal_progress = use_wipe ? transition_progress : 1.0f;
          const lv_color_t selected_text_color = use_fade ? blend_color(lv_color_hex(0x000000), selected_color, transition_progress) : selected_color;

          draw_graph(id(selected_graph), selected_hist_view, metric, selected_baseline, selected_minutes, selected_color, selected_graph_opa, selected_reveal_progress);
          lv_label_set_text(id(selected_graph_label), selected_title.c_str());
          lv_label_set_text(id(selected_graph_meta), selected_header_meta.c_str());
          lv_obj_set_style_text_color(id(selected_graph_label), selected_text_color, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(selected_graph_meta), selected_text_color, LV_PART_MAIN);
          set_row_palette(metric, selected_text_color);

          const float pm_value = id(pm_2_5).has_state() ? id(pm_2_5).state : 0.0f;
          const float voc_value = id(sen55_voc).has_state() ? id(sen55_voc).state : 0.0f;
          const float pm_delta = delta_for(id(pm25_history), 5);
          const float voc_delta = delta_for(id(voc_history), 5);
          const lv_color_t pm_color = pm_color_for(pm_value);
          const lv_color_t voc_color = graph_color_for_metric(6, voc_value);
          std::string pm_meta = "STEADY";
          if (pm_delta > 3.0f) {
            pm_meta = "RISING";
          } else if (pm_delta < -3.0f) {
            pm_meta = "CLEARING";
          }
          std::string voc_meta = "STEADY";
          if (voc_delta > 20.0f) {
            voc_meta = "RISING";
          } else if (voc_delta < -20.0f) {
            voc_meta = "EASING";
          }

          draw_graph(id(pm25_graph_large), window_for_minutes(id(pm25_history), id(pm25_graph_minutes).state, 6.0f), 3, 25.0f, id(pm25_graph_minutes).state, pm_color, LV_OPA_COVER, 1.0f);
          draw_graph(id(voc_graph_large), window_for_minutes(id(voc_history), id(voc_graph_minutes).state, 6.0f), 6, 150.0f, id(voc_graph_minutes).state, voc_color, LV_OPA_COVER, 1.0f);
          const std::string pm_history_title = "PM2.5 | " + format_history_window(id(pm25_graph_minutes).state);
          const std::string voc_history_title = "VOC | " + format_history_window(id(voc_graph_minutes).state);
          lv_label_set_text(id(trends_pm_title), pm_history_title.c_str());
          lv_obj_set_style_text_color(id(trends_pm_title), pm_color, LV_PART_MAIN);
          lv_label_set_text(id(trends_voc_title), voc_history_title.c_str());
          lv_obj_set_style_text_color(id(trends_voc_title), voc_color, LV_PART_MAIN);
          lv_label_set_text(id(trends_hint_label), "Tap rows on overview to switch history");

number:
  - platform: template
    name: "LED: Day Brightness"
    id: auto_led_brightness
    restore_value: true
    initial_value: 70
    min_value: 40
