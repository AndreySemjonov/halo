time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: time_update
      - script.execute: update_display_brightness
      - script.execute: update_air_quality_leds

script:
  - id: time_update
    then:
      - lvgl.label.update:
          id: timeVal
          text: !lambda |-
            static char time_buf[17];
            auto now = id(ha_time).now();
            bool is_pm = now.hour >= 12;
            int hour_12 = now.hour % 12;
            if (hour_12 == 0) {
              hour_12 = 12; // 12 AM/PM should be displayed as 12, not 0
            }
            if(id(time_format).state) {
              snprintf(time_buf, sizeof(time_buf), "%02d:%02d", now.hour, now.minute);
            }
            else {
              snprintf(time_buf, sizeof(time_buf), "%2d:%02d%s", hour_12, now.minute, is_pm ? "PM" : "AM");
            }
            return time_buf;
  - id: wake_display
    mode: restart
    then:
      - lambda: |-
          float brightness = id(display_day_brightness).state / 100.0f;
          auto now = id(ha_time).now();
          if (id(adaptive_display_brightness).state && now.is_valid()) {
            const int start_hour = static_cast<int>(id(night_mode_start_hour).state);
            const int end_hour = static_cast<int>(id(night_mode_end_hour).state);
            bool is_night = false;
            if (start_hour == end_hour) {
              is_night = true;
            } else if (start_hour < end_hour) {
              is_night = now.hour >= start_hour && now.hour < end_hour;
            } else {
              is_night = now.hour >= start_hour || now.hour < end_hour;
            }

            if (is_night) {
              brightness = id(display_night_brightness).state / 100.0f;
            }
          }

          auto call = id(display_backlight).turn_on();
          call.set_transition_length(150);
          call.set_brightness(brightness);
          call.perform();
  - id: update_page_chrome
    mode: restart
    then:
      - lambda: |-
          const int page = id(current_page_index);
          std::string title = "OVERVIEW";
          std::string dots = "● ○ ○";
          if (page == 1) {
            title = "TRENDS";
            dots = "○ ● ○";
          } else if (page == 2) {
            title = "STATUS";
            dots = "○ ○ ●";
          }
          const lv_color_t active = lv_color_hex(0x76FA76);
          const lv_color_t inactive = lv_color_hex(0x35525A);
          lv_obj_set_style_bg_color(id(page_dot_1), page == 0 ? active : inactive, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(page_dot_2), page == 1 ? active : inactive, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(page_dot_3), page == 2 ? active : inactive, LV_PART_MAIN);
  - id: toggle_auto_led_mode
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: auto_air_quality_leds
          then:
            - switch.turn_off: auto_air_quality_leds
            - light.turn_off: rgb_light
          else:
            - switch.turn_on: auto_air_quality_leds
            - script.execute: update_air_quality_leds
      - script.execute: refresh_status_page
  - id: advance_auto_graph_selection
    mode: restart
    then:
      - lambda: |-
          auto pm_metric_for_cycle = [&]() -> int {
            struct Candidate {
              int metric;
              float value;
            };

            Candidate candidates[] = {
              {2, id(pm_1_0).has_state() ? id(pm_1_0).state : -1.0f},
              {3, id(pm_2_5).has_state() ? id(pm_2_5).state : -1.0f},
              {4, id(pm_4_0).has_state() ? id(pm_4_0).state : -1.0f},
              {5, id(pm_10_0).has_state() ? id(pm_10_0).state : -1.0f},
            };

            int best_metric = 3;
            float best_value = candidates[1].value;
            for (const auto &candidate : candidates) {
              if (candidate.value > best_value) {
                best_metric = candidate.metric;
                best_value = candidate.value;
              }
            }
            return best_metric;
          };

          auto group_for_metric = [](int metric) -> int {
            if (metric == 0) return 0;
            if (metric == 1) return 1;
            if (metric >= 2 && metric <= 5) return 2;
            if (metric == 6) return 3;
            if (metric == 7) return 4;
            return 5;
          };

          const int next_group = (group_for_metric(id(selected_graph_metric)) + 1) % 6;
          int next_metric = 3;
          switch (next_group) {
            case 0:
              next_metric = 0;
              break;
            case 1:
              next_metric = 1;
              break;
            case 2:
              next_metric = pm_metric_for_cycle();
              break;
            case 3:
              next_metric = 6;
              break;
            case 4:
              next_metric = 7;
              break;
            default:
              next_metric = 8;
              break;
          }

          id(set_graph_metric).execute(next_metric);
  - id: set_graph_metric
    mode: restart
    parameters:
      metric_target: int
    then:
      - lambda: |-
          const int current_metric = id(selected_graph_metric);
          const std::string transition_mode = id(graph_transition_mode).state;
          id(selected_graph_metric) = metric_target;
          id(last_graph_switch_ms) = millis();
          if (metric_target == current_metric || transition_mode == "Instant") {
            id(graph_transition_active) = false;
            id(graph_transition_last_frame_ms) = 0;
            return;
          }
          id(graph_transition_start_ms) = millis();
          id(graph_transition_last_frame_ms) = 0;
          id(graph_transition_active) = true;
      - script.execute: redraw_graphs
  - id: show_overview_page
    mode: restart
    then:
      - lvgl.page.show:
          id: main_page
          animation: MOVE_RIGHT
          time: 220ms
      - lambda: 'id(current_page_index) = 0;'
      - script.execute: update_page_chrome
  - id: show_trends_page
    mode: restart
    then:
      - lvgl.page.show:
          id: trends_page
          animation: MOVE_LEFT
          time: 220ms
      - lambda: 'id(current_page_index) = 1;'
      - script.execute: update_page_chrome
      - script.execute: refresh_status_page
      - script.execute: redraw_graphs
  - id: show_status_page
    mode: restart
    then:
      - lvgl.page.show:
          id: status_page
          animation: MOVE_LEFT
          time: 220ms
      - lambda: 'id(current_page_index) = 2;'
      - script.execute: update_page_chrome
      - script.execute: refresh_status_page
  - id: show_next_page
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(current_page_index) == 0;'
          then:
            - script.execute: show_trends_page
          else:
            - if:
                condition:
                  lambda: 'return id(current_page_index) == 1;'
                then:
                  - script.execute: show_status_page
                else:
                  - script.execute: show_overview_page
  - id: show_previous_page
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(current_page_index) == 0;'
          then:
            - lvgl.page.show:
                id: status_page
                animation: MOVE_RIGHT
                time: 220ms
            - lambda: 'id(current_page_index) = 2;'
            - script.execute: update_page_chrome
            - script.execute: refresh_status_page
          else:
            - if:
                condition:
                  lambda: 'return id(current_page_index) == 1;'
                then:
