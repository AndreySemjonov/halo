  - platform: scd4x
    id: scd40
    co2:
      name: "CO2"
      id: "co2"
      on_value:
        then:
          - lambda: |-
              auto &hist = id(co2_history);
              if (hist.size() != 360) {
                hist.assign(360, x);
              }
              for (size_t i = 0; i + 1 < hist.size(); i++) {
                hist[i] = hist[i + 1];
              }
              hist.back() = x;
          - lvgl.label.update:
              id: co2_value
              text: !lambda |-
                static char buffer[10];
                snprintf(buffer, sizeof(buffer), "%d", (int)x);
                return buffer;
          - if:
              condition:
                lambda: "return x <= 600;"
              then:
                - lvgl.label.update:
                    id: co2_value
                    text_color: my_green                     
              else:
                - if:
                    condition:
                      lambda: "return x <= 1000;"
                    then:
                      - lvgl.label.update:
                          id: co2_value
                          text_color: my_yellow                         
                    else:
                      - if:
                          condition:
                            lambda: "return x <= 1500;"
                          then:
                            - lvgl.label.update:
                                id: co2_value
                                text_color: my_orange                                 
                          else:
                            - lvgl.label.update:
                                id: co2_value
                                text_color: my_red
          - script.execute: redraw_graphs
          - script.execute: update_alert_state
          - script.execute: update_footer_summary
    automatic_self_calibration: false
    update_interval: 10s
